<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmonic strings · Lab</title><link rel="stylesheet" href="harmonic-strings.css"></head>
<body><main class="lab" aria-label="Harmonic series string lab">
<aside class="sidebar" aria-label="String controls and chord presets">
<div class="toolbar">
<label class="rootControl">Root <output id="rootValue">110 Hz</output><input id="root" type="range" min="55" max="220" value="110" step="1"></label>
<div class="rangeControls"><label>From <input id="low" type="number" min="1" max="64" value="1"></label><label>to <input id="high" type="number" min="1" max="64" value="16"></label></div>
<button id="series">Play series</button><button id="stop">Stop sound</button></div>
<div id="presets" class="presets" role="group" aria-label="Play a harmonic chord"></div>
<output id="sustainedChord" class="sustainedChord" aria-label="Sustained harmonics" aria-live="polite"></output>
</aside>
<section id="strings" class="strings" aria-label="Playable harmonic strings"></section>
</main><script src="../audio/synth.js"></script><script src="harmonic-strings.js"></script><script src="harmonic-series.js"></script></body></html>
