<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just Intonation Applet</title>
  <style>
    :root {
      --bg: #100c17;
      --bg-2: #1d152b;
      --ink: #fff9f2;
      --soft: rgba(255, 249, 242, 0.72);
      --muted: rgba(255, 249, 242, 0.48);
      --line: rgba(255, 255, 255, 0.14);
      --accent: #ffbc66;
      --accent-2: #8fd3ff;
      --green: #98f5b4;
      --panel: rgba(255, 255, 255, 0.045);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(143, 211, 255, 0.14), transparent 32%),
        radial-gradient(circle at bottom left, rgba(255, 188, 102, 0.15), transparent 38%),
        linear-gradient(165deg, var(--bg), var(--bg-2));
    }

    body { padding: 0.55rem; }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 2.15rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 0.42rem 0.68rem;
      background: rgba(255, 255, 255, 0.06);
      color: var(--ink);
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    button:hover,
    button:focus-visible {
      border-color: rgba(255, 188, 102, 0.7);
      color: var(--accent);
      outline: none;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .panel {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0.55rem;
      padding: 0.65rem;
      border-radius: 1.15rem;
      border: 1px solid var(--line);
      background: rgba(9, 4, 15, 0.55);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
    }

    .status {
      color: var(--soft);
      font-size: 0.82rem;
    }

    .audioButton,
    .primaryButton {
      border-color: rgba(255, 188, 102, 0.62);
      background: rgba(255, 188, 102, 0.16);
      color: var(--accent);
      font-weight: 850;
    }

    .audioButton.playing,
    .loopCell.playing .playCell {
      background: linear-gradient(135deg, var(--accent), #ffd79d);
      color: #201204;
    }

    .body {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(15rem, 24rem);
      gap: 0.65rem;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 0.55rem;
    }

    .card,
    .visualizer {
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--panel);
      padding: 0.68rem;
      min-width: 0;
    }

    .cardHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.45rem;
      color: var(--soft);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .intervalGrid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.6rem;
      align-items: center;
    }

    .sliderStack,
    .rootControl {
      min-width: 0;
      display: grid;
      gap: 0.42rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .ticks {
      position: relative;
      height: 1.55rem;
      color: rgba(255, 255, 255, 0.52);
      font-size: 0.65rem;
    }

    .tick {
      position: absolute;
      left: 0;
      top: 0;
      min-width: 2.65rem;
      text-align: center;
      transform: translateX(-50%);
      white-space: nowrap;
      border: 0;
      padding: 0.12rem 0;
      background: transparent;
      color: inherit;
      font-size: inherit;
      min-height: 1.4rem;
    }

    .tick:hover,
    .tick:focus-visible,
    .tick.active {
      color: var(--accent);
      outline: none;
    }

    .tick:active {
      transform: translateX(-50%);
    }

    .rootHeader,
    .scaleMeta {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      color: var(--soft);
      font-size: 0.82rem;
    }

    .rootValue,
    .ratioValue {
      color: var(--accent-2);
      font-weight: 850;
    }

    .scaleChips,
    .keyboardRow {
      display: flex;
      flex-wrap: wrap;
      gap: 0.34rem;
      align-items: center;
    }

    .scaleChip {
      display: inline-flex;
      gap: 0.38rem;
      align-items: center;
      min-height: 1.82rem;
      border-color: rgba(143, 211, 255, 0.28);
      background: rgba(143, 211, 255, 0.08);
      color: var(--ink);
    }

    .scaleChip.root {
      border-color: rgba(255, 188, 102, 0.56);
      background: rgba(255, 188, 102, 0.13);
    }

    .removeNote {
      display: inline-grid;
      place-items: center;
      width: 1rem;
      height: 1rem;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 900;
    }

    .keyCap {
      display: inline-grid;
      grid-template-columns: auto minmax(2rem, auto);
      gap: 0.32rem;
      align-items: center;
      padding: 0.28rem 0.46rem;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 0.55rem;
      background: rgba(255, 255, 255, 0.055);
      color: var(--soft);
      font-size: 0.72rem;
    }

    .keyCap strong {
      color: var(--accent);
      font-size: 0.78rem;
    }

    .loopGrid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.45rem;
      overflow: auto;
      padding-right: 0.15rem;
    }

    .loopCell {
      min-height: 6.2rem;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 0.28rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.85rem;
      background: rgba(0, 0, 0, 0.16);
      padding: 0.48rem;
    }

    .loopCell.playing {
      border-color: rgba(255, 188, 102, 0.72);
      box-shadow: 0 0 26px rgba(255, 188, 102, 0.12);
    }

    .cellTop,
    .cellActions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.4rem;
    }

    .cellTop {
      color: var(--soft);
      font-size: 0.78rem;
      font-weight: 850;
    }

    .cellType {
      color: var(--accent-2);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .cellSummary {
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.2;
      overflow: hidden;
    }

    .cellActions {
      flex-wrap: wrap;
    }

    .cellActions button {
      min-height: 1.55rem;
      padding: 0.2rem 0.38rem;
      font-size: 0.66rem;
    }

    .visualizer {
      position: relative;
      min-height: 0;
      overflow: hidden;
      display: grid;
      padding: 0.52rem;
    }

    .lissajousCanvas {
      width: 100%;
      height: 100%;
      min-height: 260px;
      display: block;
    }

    .visualizerOverlay {
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: end;
      color: var(--soft);
      font-size: 0.86rem;
      pointer-events: none;
    }

    .visualizerOverlay strong {
      color: var(--ink);
      font-size: 1rem;
    }

    .centsText {
      color: var(--accent-2);
      font-weight: 800;
      font-size: 0.82rem;
    }

    @media (max-width: 1020px) {
      body { overflow: auto; }
      .panel { height: auto; min-height: 100%; }
      .body { grid-template-columns: 1fr; }
      .workspace { grid-template-rows: auto auto auto; }
      .loopGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; }
      .visualizer { min-height: 320px; }
    }

    @media (max-width: 640px) {
      body { padding: 0.55rem; }
      .panel { padding: 0.65rem; }
      .top,
      .intervalGrid,
      .rootHeader,
      .scaleMeta { display: grid; }
      .audioButton,
      .primaryButton { width: 100%; }
      .loopGrid { grid-template-columns: 1fr; }
    }
    /* Lab layout: drone, slider and figure first; scale tools collapsed below. */
    html, body { overflow-x: hidden; overflow-y: auto; }
    .panel { height: auto; min-height: 100%; grid-template-rows: auto minmax(200px, 1fr) auto auto; }
    .visualizer { min-height: 200px; }
    .lissajousCanvas { position: absolute; inset: 0.52rem; width: calc(100% - 1.04rem); height: calc(100% - 1.04rem); min-height: 0; }
    .more {
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--panel);
    }
    .more > summary {
      cursor: pointer;
      list-style: none;
      padding: 0.68rem;
      color: var(--soft);
      font-size: 0.86rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .more > summary::-webkit-details-marker { display: none; }
    .more > summary::after { content: "+"; color: var(--accent); font-size: 1.1rem; }
    .more[open] > summary::after { content: "\2212"; }
    .more > summary:hover, .more > summary:focus-visible { color: var(--accent); outline: none; }
    .moreBody { display: grid; gap: 0.55rem; padding: 0 0.55rem 0.55rem; }
    .moreBody .primaryButton { width: 100%; margin-bottom: 0.55rem; }
    .moreBody .loopGrid { overflow: visible; }
  </style>
</head>
<body>
  <main class="panel">
    <section class="top">
      <div class="status" id="statusText">Start the drone, then slide the upper note until the figure holds still.</div>
      <button class="audioButton" id="audioButton" type="button">Start drone</button>
    </section>

    <aside class="visualizer" aria-label="Lissajous figure for the current interval">
      <canvas class="lissajousCanvas" id="lissajousCanvas"></canvas>
      <div class="visualizerOverlay" aria-live="polite">
        <strong id="ratioText">3/2</strong>
        <span class="centsText" id="centsText">702c</span>
      </div>
    </aside>

    <section class="card" aria-label="Upper note">
      <div class="cardHeader">
        <span>Upper note</span>
        <span class="ratioValue" id="ratioReadout">3/2 - 702c</span>
      </div>
      <label class="sliderStack" for="ratioSlider">
        <input id="ratioSlider" type="range" min="0" max="1200" step="1" value="702" />
        <span class="ticks" id="ticks"></span>
      </label>
    </section>

    <details class="more">
      <summary>Build a scale and make loops</summary>
      <div class="moreBody">
        <section class="card" aria-label="Interval picker">
          <div class="cardHeader">
            <span>Interval picker</span>
          </div>
          <button class="primaryButton" id="addNoteButton" type="button">Add the current interval to the scale</button>
          <label class="rootControl" for="rootSlider">
            <span class="rootHeader">
              <span>Root frequency</span>
              <span class="rootValue" id="rootValue">220 Hz</span>
            </span>
            <input id="rootSlider" type="range" min="80" max="440" step="1" value="220" />
          </label>
        </section>

        <section class="card" aria-label="Scale keyboard">
          <div class="cardHeader">
            <span>Scale</span>
            <span class="scaleMeta"><span id="scaleCount">2 notes</span></span>
          </div>
          <div class="scaleChips" id="scaleChips"></div>
          <div class="keyboardRow" id="keyboardRow" aria-label="Computer keyboard mapping"></div>
        </section>

        <section class="card" aria-label="Loop cells">
          <div class="cardHeader">
            <span>Loop cells</span>
            <span>4 bars - 90 BPM</span>
          </div>
          <div class="loopGrid" id="loopGrid"></div>
        </section>
      </div>
    </details>
  </main>

  <script src="../audio/synth.js"></script>
  <script>
    const intervals = [
      { ratio: "1/1", name: "Unison", value: 1 },
      { ratio: "16/15", name: "Minor second", value: 16 / 15 },
      { ratio: "9/8", name: "Major second", value: 9 / 8 },
      { ratio: "7/6", name: "Septimal minor third", value: 7 / 6 },
      { ratio: "6/5", name: "Minor third", value: 6 / 5 },
      { ratio: "5/4", name: "Major third", value: 5 / 4 },
      { ratio: "4/3", name: "Perfect fourth", value: 4 / 3 },
      { ratio: "11/8", name: "Undecimal semi-augmented fourth", value: 11 / 8 },
      { ratio: "10/7", name: "Septimal tritone", value: 10 / 7 },
      { ratio: "3/2", name: "Perfect fifth", value: 3 / 2 },
      { ratio: "8/5", name: "Minor sixth", value: 8 / 5 },
      { ratio: "5/3", name: "Major sixth", value: 5 / 3 },
      { ratio: "7/4", name: "Harmonic seventh", value: 7 / 4 },
      { ratio: "15/8", name: "Major seventh", value: 15 / 8 },
      { ratio: "2/1", name: "Octave", value: 2 }
    ].map(item => ({ ...item, cents: 1200 * Math.log2(item.value), exact: true }));

    // Every 15-odd-limit ratio from 1/1 to 2/1, built exactly from odd numbers up to 15.
    const ODD_LIMIT = 15;
    const LOCK_CENTS = 5; // the figure locks when the slider is this close to a ratio
    function gcd(a, b) { return b ? gcd(b, a % b) : a; }
    const lockTargets = (() => {
      const seen = new Map();
      for (let a = 1; a <= ODD_LIMIT; a += 2) {
        for (let b = 1; b <= ODD_LIMIT; b += 2) {
          let n = a, d = b;
          while (n < d) n *= 2;
          while (n >= 2 * d) d *= 2;
          const g = gcd(n, d); n /= g; d /= g;
          seen.set(`${n}/${d}`, { n, d });
        }
      }
      seen.set("2/1", { n: 2, d: 1 });
      return [...seen.entries()].map(([ratio, { n, d }]) => {
        const named = intervals.find(item => item.ratio === ratio);
        return { ratio, n, d, value: n / d, cents: 1200 * Math.log2(n / d), name: named ? named.name : ratio, exact: true };
      }).sort((x, y) => x.cents - y.cents);
    })();

    const keyboardKeys = ["a", "s", "d", "f", "g", "h", "j", "k"];
    const bpm = 90;
    const beatsPerLoop = 16;
    const secondsPerBeat = 60 / bpm;
    const loopSeconds = beatsPerLoop * secondsPerBeat;

    const audioButton = document.getElementById("audioButton");
    const addNoteButton = document.getElementById("addNoteButton");
    const slider = document.getElementById("ratioSlider");
    const rootSlider = document.getElementById("rootSlider");
    const rootValue = document.getElementById("rootValue");
    const ticks = document.getElementById("ticks");
    const scaleChips = document.getElementById("scaleChips");
    const keyboardRow = document.getElementById("keyboardRow");
    const scaleCount = document.getElementById("scaleCount");
    const loopGrid = document.getElementById("loopGrid");
    const statusText = document.getElementById("statusText");
    const ratioReadout = document.getElementById("ratioReadout");
    const lissajousCanvas = document.getElementById("lissajousCanvas");
    const ratioText = document.getElementById("ratioText");
    const centsText = document.getElementById("centsText");
    const lissajousCtx = lissajousCanvas.getContext("2d");

    let playingDrone = false;
    let renderedRatio = 2 ** (Number(slider.value) / 1200);
    let lissajousPhase = Math.PI / 2;
    let activeLoop = null;
    let loopTimer = null;
    let nextEventIndex = 0;
    let scheduledLoopStart = 0;

    const scaleNotes = [
      makeScaleNote(intervals[0]),
      makeScaleNote(intervals[intervals.length - 1])
    ];

    const cells = Array.from({ length: 8 }, (_, index) => ({
      id: index,
      type: null,
      events: []
    }));

    function baseFrequency() {
      return Number(rootSlider.value);
    }

    function centsToRatio(cents) {
      return 2 ** (cents / 1200);
    }

    function nearestInterval(cents) {
      return lockTargets.reduce((best, item) => {
        return Math.abs(item.cents - cents) < Math.abs(best.cents - cents) ? item : best;
      }, lockTargets[0]);
    }

    // The 15-odd-limit ratio the slider is locked to, or undefined.
    function exactInterval(cents) {
      const nearest = nearestInterval(cents);
      return Math.abs(nearest.cents - cents) <= LOCK_CENTS ? nearest : undefined;
    }

    function currentCents() {
      return Number(slider.value);
    }

    function currentRatio() {
      const exact = exactInterval(currentCents());
      return exact ? exact.value : centsToRatio(currentCents());
    }

    function currentNote() {
      const cents = currentCents();
      const exact = exactInterval(cents);
      if (exact) return makeScaleNote(exact);
      const ratioValue = centsToRatio(cents);
      return {
        ratioLabel: `${Math.round(cents)}c`,
        ratioValue,
        cents,
        name: `Approx ${ratioValue.toFixed(4)}:1`,
        exact: false
      };
    }

    function makeScaleNote(interval) {
      return {
        ratioLabel: interval.ratio,
        ratioValue: interval.value,
        cents: interval.cents,
        name: interval.name,
        exact: Boolean(interval.exact),
        pinned: interval.ratio === "1/1"
      };
    }

    async function resumeAudio() {
      if (!window.XenAudio || !XenAudio.isAvailable()) {
        statusText.textContent = "Audio is unavailable in this browser.";
        return false;
      }
      return XenAudio.resume();
    }

    async function startDrone() {
      if (!(await resumeAudio())) return;
      await XenAudio.startDrone({
        id: "ji-root",
        frequency: baseFrequency(),
        gain: 0.12,
        voice: "drone"
      });
      await XenAudio.startDrone({
        id: "ji-upper",
        frequency: baseFrequency() * currentRatio(),
        gain: 0.1,
        voice: "drone"
      });
      playingDrone = true;
      audioButton.textContent = "Stop drone";
      audioButton.classList.add("playing");
    }

    function stopDrone() {
      if (window.XenAudio) {
        XenAudio.stopDrone("ji-root", 0.08);
        XenAudio.stopDrone("ji-upper", 0.08);
      }
      playingDrone = false;
      audioButton.textContent = "Start drone";
      audioButton.classList.remove("playing");
    }

    function updateDroneFrequency() {
      if (!playingDrone || !window.XenAudio) return;
      XenAudio.updateDrone({
        id: "ji-root",
        frequency: baseFrequency(),
        gain: 0.12,
        rampTime: 0.015
      });
      XenAudio.updateDrone({
        id: "ji-upper",
        frequency: baseFrequency() * currentRatio(),
        gain: 0.1,
        rampTime: 0.015
      });
    }

    async function triggerNote(note, duration = 0.72, gainValue = 0.17) {
      if (!(await resumeAudio())) return;
      XenAudio.playRatio({
        rootFrequency: baseFrequency(),
        ratio: note.ratioValue,
        duration,
        gain: gainValue,
        voice: "default"
      });
    }

    function addCurrentNote() {
      const note = currentNote();
      const duplicate = scaleNotes.some(existing => Math.abs(existing.cents - note.cents) < 1);
      if (duplicate) {
        statusText.textContent = `${note.ratioLabel} is already in the scale.`;
        return;
      }
      scaleNotes.push(note);
      sortScale();
      renderScale();
      statusText.textContent = `Added ${note.ratioLabel} to the scale.`;
      triggerNote(note);
    }

    function sortScale() {
      scaleNotes.sort((a, b) => a.cents - b.cents);
    }

    function removeScaleNote(cents) {
      const index = scaleNotes.findIndex(note => Math.abs(note.cents - cents) < 0.5);
      if (index < 0 || scaleNotes[index].pinned) return;
      const label = scaleNotes[index].ratioLabel;
      scaleNotes.splice(index, 1);
      renderScale();
      statusText.textContent = `Removed ${label} from the scale.`;
    }

    function renderScale() {
      scaleChips.replaceChildren();
      keyboardRow.replaceChildren();
      scaleCount.textContent = `${scaleNotes.length} note${scaleNotes.length === 1 ? "" : "s"}`;

      scaleNotes.forEach(note => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = `scaleChip${note.pinned ? " root" : ""}`;
        chip.title = note.name;
        chip.innerHTML = `<strong>${note.ratioLabel}</strong>`;
        chip.addEventListener("click", event => {
          if (event.target.closest(".removeNote")) return;
          triggerNote(note);
        });

        if (!note.pinned) {
          const remove = document.createElement("span");
          remove.className = "removeNote";
          remove.textContent = "x";
          remove.setAttribute("aria-hidden", "true");
          chip.appendChild(remove);
          chip.addEventListener("dblclick", () => removeScaleNote(note.cents));
          remove.addEventListener("click", event => {
            event.stopPropagation();
            removeScaleNote(note.cents);
          });
        }

        scaleChips.appendChild(chip);
      });

      keyboardKeys.forEach((key, index) => {
        const note = scaleNotes[index];
        const keyCap = document.createElement("span");
        keyCap.className = "keyCap";
        keyCap.innerHTML = `<strong>${key.toUpperCase()}</strong><span>${note ? note.ratioLabel : "-"}</span>`;
        keyboardRow.appendChild(keyCap);
      });

      renderCells();
    }

    function scaleIndexCandidates(excludeOctave = false) {
      const indices = scaleNotes.map((note, index) => index);
      if (excludeOctave && indices.length > 2) return indices.slice(0, -1);
      return indices;
    }

    function randomScaleIndex(excludeOctave = false) {
      const candidates = scaleIndexCandidates(excludeOctave);
      return candidates[Math.floor(Math.random() * candidates.length)] || 0;
    }

    function generateChordCell(cell) {
      const candidates = scaleIndexCandidates(true);
      const count = Math.min(candidates.length, 2 + Math.floor(Math.random() * 3));
      const selected = new Set([0]);
      while (selected.size < count) {
        selected.add(candidates[Math.floor(Math.random() * candidates.length)] || 0);
      }
      const chord = Array.from(selected).sort((a, b) => a - b);
      cell.type = "chord";
      cell.events = [];
      [0, 4, 8, 12].forEach(startBeat => {
        chord.forEach(scaleIndex => {
          cell.events.push({ startBeat, durationBeats: 3.55, scaleIndex, gain: 0.085, voice: "default" });
        });
      });
      statusText.textContent = `Generated chord loop in cell ${cell.id + 1}.`;
      renderCells();
    }

    function generateMelodyCell(cell) {
      cell.type = "melody";
      cell.events = [];
      for (let beat = 0; beat < beatsPerLoop; beat += 1) {
        const rootMoment = beat % 8 === 0;
        cell.events.push({
          startBeat: beat,
          durationBeats: 0.82,
          scaleIndex: rootMoment ? 0 : randomScaleIndex(false),
          gain: 0.13,
          voice: "default"
        });
      }
      statusText.textContent = `Generated melody loop in cell ${cell.id + 1}.`;
      renderCells();
    }

    function eventDescription(cell) {
      if (!cell.type) return "Empty cell. Generate a chord or melody.";
      const unique = Array.from(new Set(cell.events.map(event => scaleNotes[event.scaleIndex]?.ratioLabel).filter(Boolean)));
      return `${cell.type === "chord" ? "Chord" : "Melody"} using ${unique.slice(0, 5).join(", ")}${unique.length > 5 ? "..." : ""}`;
    }

    function renderCells() {
      loopGrid.replaceChildren();
      cells.forEach(cell => {
        const node = document.createElement("article");
        node.className = `loopCell${activeLoop === cell ? " playing" : ""}`;
        node.innerHTML = `
          <div class="cellTop">
            <span>Cell ${cell.id + 1}</span>
            <span class="cellType">${cell.type || "empty"}</span>
          </div>
          <div class="cellSummary">${eventDescription(cell)}</div>
          <div class="cellActions">
            <button type="button" class="genChord">Chord</button>
            <button type="button" class="genMelody">Melody</button>
            <button type="button" class="playCell" ${cell.events.length ? "" : "disabled"}>${activeLoop === cell ? "Stop" : "Play"}</button>
            <button type="button" class="exportCell" ${cell.events.length ? "" : "disabled"}>WAV</button>
          </div>
        `;
        node.querySelector(".genChord").addEventListener("click", () => generateChordCell(cell));
        node.querySelector(".genMelody").addEventListener("click", () => generateMelodyCell(cell));
        node.querySelector(".playCell").addEventListener("click", () => toggleCell(cell));
        node.querySelector(".exportCell").addEventListener("click", () => exportCell(cell));
        loopGrid.appendChild(node);
      });
    }

    function toggleCell(cell) {
      if (activeLoop === cell) {
        stopLoop();
        return;
      }
      playCell(cell);
    }

    async function playCell(cell) {
      if (!cell.events.length || !(await resumeAudio())) return;
      stopLoop(false);
      activeLoop = cell;
      scheduledLoopStart = XenAudio.currentTime() + 0.04;
      nextEventIndex = 0;
      scheduleLoopEvents();
      loopTimer = window.setInterval(scheduleLoopEvents, 90);
      statusText.textContent = `Playing cell ${cell.id + 1}.`;
      renderCells();
    }

    function stopLoop(render = true) {
      if (loopTimer) window.clearInterval(loopTimer);
      loopTimer = null;
      activeLoop = null;
      if (render) {
        statusText.textContent = "Loop stopped.";
        renderCells();
      }
    }

    function scheduleLoopEvents() {
      if (!activeLoop || !window.XenAudio) return;
      const lookAhead = 0.28;
      const now = XenAudio.currentTime();
      while (scheduledLoopStart < now + lookAhead) {
        const ordered = activeLoop.events.slice().sort((a, b) => a.startBeat - b.startBeat);
        for (let i = nextEventIndex; i < ordered.length; i += 1) {
          const event = ordered[i];
          const when = scheduledLoopStart + event.startBeat * secondsPerBeat;
          if (when > now + lookAhead) {
            nextEventIndex = i;
            return;
          }
          XenAudio.scheduleEvents({
            events: [toAudioEvent(event)],
            rootFrequency: baseFrequency(),
            startTime: scheduledLoopStart,
            bpm
          });
        }
        scheduledLoopStart += loopSeconds;
        nextEventIndex = 0;
      }
    }

    function toAudioEvent(event) {
      const note = scaleNotes[event.scaleIndex] || scaleNotes[0];
      return {
        startBeat: event.startBeat,
        durationBeats: event.durationBeats,
        ratio: note.ratioValue,
        gain: event.gain,
        voice: event.voice || "default"
      };
    }

    async function exportCell(cell) {
      if (!cell.events.length) return;
      if (!window.XenAudio) {
        statusText.textContent = "WAV export is unavailable in this browser.";
        return;
      }
      statusText.textContent = `Rendering cell ${cell.id + 1}...`;
      const rendered = await XenAudio.renderWav({
        events: cell.events.map(toAudioEvent),
        rootFrequency: baseFrequency(),
        durationSeconds: loopSeconds,
        bpm,
        filename: `ji-loop-cell-${cell.id + 1}.wav`,
        voice: "default"
      });
      statusText.textContent = rendered ? `Exported cell ${cell.id + 1}.` : "WAV export is unavailable in this browser.";
    }

    function layoutIntervalTicks() {
      const width = ticks.clientWidth;
      const thumbInset = parseFloat(getComputedStyle(document.documentElement).fontSize) * 0.55;
      const travelWidth = Math.max(1, width - thumbInset * 2);
      ticks.querySelectorAll(".tick").forEach(tick => {
        const position = Number(tick.dataset.position);
        tick.style.left = `${thumbInset + position * travelWidth}px`;
      });
    }

    function lissajousFrequenciesFor(interval) {
      return { xFrequency: interval.n, yFrequency: interval.d, turnCount: 1 };
    }

    function resizeLissajousCanvas() {
      const rect = lissajousCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));
      if (lissajousCanvas.width !== width || lissajousCanvas.height !== height) {
        lissajousCanvas.width = width;
        lissajousCanvas.height = height;
      }
      lissajousCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { width: rect.width, height: rect.height };
    }

    function drawLissajousFrame() {
      const { width, height } = resizeLissajousCanvas();
      const exact = exactInterval(currentCents());
      renderedRatio = exact ? exact.value : currentRatio();
      const lineColor = exact ? "rgba(255,188,102,0.94)" : "rgba(143,211,255,0.88)";
      const glowColor = exact ? "rgba(255,188,102,0.18)" : "rgba(143,211,255,0.16)";
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.max(12, Math.min(width, height) * 0.38);
      const nearest = nearestInterval(currentCents());
      const { xFrequency, yFrequency, turnCount } = lissajousFrequenciesFor(nearest);
      const fullTurn = Math.PI * 2 * turnCount;
      const pointCount = Math.max(1400, Math.ceil(Math.max(xFrequency, yFrequency) * turnCount * 700));
      const phase = lissajousPhase;

      lissajousCtx.clearRect(0, 0, width, height);
      lissajousCtx.fillStyle = "rgba(5, 3, 10, 0.34)";
      lissajousCtx.fillRect(0, 0, width, height);
      lissajousCtx.save();
      lissajousCtx.translate(centerX, centerY);
      lissajousCtx.beginPath();
      lissajousCtx.lineCap = "round";
      lissajousCtx.lineJoin = "round";
      for (let i = 0; i <= pointCount; i += 1) {
        const progress = i / pointCount;
        const t = progress * fullTurn;
        const x = Math.sin(t * xFrequency) * radius;
        const y = Math.sin(t * yFrequency + phase) * radius;
        if (i === 0) lissajousCtx.moveTo(x, y);
        else lissajousCtx.lineTo(x, y);
      }
      lissajousCtx.shadowColor = glowColor;
      lissajousCtx.shadowBlur = 16;
      lissajousCtx.strokeStyle = lineColor;
      lissajousCtx.lineWidth = 1.85;
      lissajousCtx.stroke();
      lissajousCtx.restore();
      // Off a ratio the figure turns, faster the further off; locked, it holds still.
      if (!exact) {
        const offBy = currentCents() - nearest.cents;
        const step = Math.sign(offBy) * Math.min(0.25, Math.abs(offBy) * 0.004);
        lissajousPhase = (lissajousPhase + step + Math.PI * 2) % (Math.PI * 2);
      }
      window.requestAnimationFrame(drawLissajousFrame);
    }

    function update() {
      const cents = currentCents();
      const exact = exactInterval(cents);
      const nearest = nearestInterval(cents);
      const ratio = currentRatio();
      const root = baseFrequency();
      const label = exact ? exact.ratio : `${ratio.toFixed(4)}:1`;

      ratioText.textContent = label;
      centsText.textContent = exact ? `${exact.cents.toFixed(2)}¢` : `${Math.round(cents)}¢`;
      ratioReadout.textContent = exact ? `${exact.ratio} - ${exact.cents.toFixed(2)}¢` : `${Math.round(cents)}¢ - near ${nearest.ratio}`;
      rootValue.textContent = `${root.toFixed(0)} Hz`;

      ticks.querySelectorAll(".tick").forEach((tick, index) => {
        tick.classList.toggle("active", Boolean(exact) && intervals[index].ratio === exact.ratio);
      });

      updateDroneFrequency();
    }

    intervals.forEach(interval => {
      const tick = document.createElement("button");
      tick.type = "button";
      tick.className = "tick";
      tick.dataset.position = String(interval.cents / 1200);
      tick.textContent = interval.ratio;
      tick.title = interval.name;
      tick.setAttribute("aria-label", `Choose ${interval.name}, ${interval.ratio}`);
      tick.addEventListener("click", () => {
        slider.value = String(Math.round(interval.cents));
        update();
      });
      ticks.appendChild(tick);
    });

    audioButton.addEventListener("click", async () => {
      if (playingDrone) {
        stopDrone();
        return;
      }
      try {
        await startDrone();
      } catch (error) {
        stopDrone();
      }
    });

    addNoteButton.addEventListener("click", addCurrentNote);
    slider.addEventListener("input", update);
    rootSlider.addEventListener("input", update);
    window.addEventListener("resize", layoutIntervalTicks);

    window.addEventListener("keydown", event => {
      if (event.repeat) return;
      const key = event.key.toLowerCase();
      const index = keyboardKeys.indexOf(key);
      if (index < 0) return;
      const note = scaleNotes[index];
      if (!note) return;
      event.preventDefault();
      triggerNote(note);
    });

    renderScale();
    renderCells();
    layoutIntervalTicks();
    update();
    window.requestAnimationFrame(drawLissajousFrame);
  </script>
</body>
</html>
