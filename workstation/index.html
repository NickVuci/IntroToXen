<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workstation · Nick Vuci</title>
  <script>
    // Inside a lesson, follow the host (the lesson page is Nocturne until it sends a theme).
    // Standalone: the stored choice, else the device setting.
    (() => {
      const root = document.documentElement;
      if (window.parent !== window) { root.dataset.theme = "dark"; return; }
      root.classList.add("standalone");
      try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") root.dataset.theme = t; } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="../shared/nv.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .work { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; }
    .work > * { min-width: 0; }

    .standing input.projectName { flex: 1; min-width: 0; font: 600 15px/1.2 var(--font-sans); color: var(--ink); background: transparent; border-color: transparent; padding-left: 0; }
    .standing input.projectName:hover, .standing input.projectName:focus { border-color: var(--hairline); padding-left: 8px; }
    .saveState { flex: none; width: 9.5em; text-align: right; white-space: nowrap; }

    /* lesson task: fixed heights so nothing moves when the verdict changes */
    .task { border-left: 2px solid var(--gold); padding: 4px 0 4px 14px; }
    .task[hidden] { display: none; }
    .task h2 { margin: 2px 0 2px; font: 600 22px/28px var(--font-display); color: var(--burgundy-ink); }
    .task p { margin: 0; max-width: 680px; color: var(--ink); }
    .taskState { margin-top: 6px; min-height: 24px; font-size: 13.5px; line-height: 24px; color: var(--ink-muted); }
    .taskState .verdict { background: var(--foil); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .scaleChips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip { display: inline-flex; align-items: baseline; gap: 8px; min-height: 32px; padding: 5px 8px; font: 500 13px/20px var(--font-mono); background: var(--surface-sunk); color: var(--ink); border: 1px solid var(--hairline); border-radius: var(--radius-sm); }
    .chip small { font-size: 11.5px; color: var(--ink-muted); }
    .chip.root { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-ink); }
    .chip button { min-height: 0; width: 20px; height: 20px; padding: 0; border: 0; background: transparent; color: var(--ink-muted); font: 500 14px/1 var(--font-sans); align-self: center; }
    .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
    .field { display: grid; gap: 4px; }
    .field input[type="number"] { width: 6.5em; }
    .field input[type="text"] { width: 9em; }
    .addInterval { display: flex; gap: 6px; align-items: end; margin-top: 12px; }

    .segmented { display: inline-flex; border: 1px solid var(--btn-edge); border-radius: var(--radius-sm); }
    .segmented button { border: 0; border-radius: 0; min-height: 34px; background: transparent; color: var(--btn-fg); }
    .segmented button + button { border-left: 1px solid var(--btn-edge); }
    .segmented button[aria-pressed="true"] { background: var(--btn-hover-edge); color: var(--on-gold); }
    :root:not([data-theme="dark"]) .segmented button[aria-pressed="true"] { background: var(--burgundy-ink); color: var(--surface-raised); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .segmented button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); } }
    .check { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; font-size: 13px; color: var(--ink); }
    .check input { width: 18px; height: 18px; accent-color: var(--blue); }

    /* ----- the grid ----- */
    .roll { overflow-x: auto; background: var(--surface-sunk); border: 1px solid var(--hairline); border-radius: var(--radius-sm); -webkit-overflow-scrolling: touch; }
    .rollInner { position: relative; display: grid; width: max-content; --cell-w: 28px; --cell-h: 30px; --label-w: 88px; }
    .rowLabel { position: sticky; left: 0; z-index: 3; display: flex; align-items: center; justify-content: flex-end; gap: 6px; height: var(--cell-h); padding: 0 8px; font: 500 12.5px/1 var(--font-mono); color: var(--ink); background: var(--surface-raised); border-right: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); white-space: nowrap; }
    .rowLabel.root { background: var(--gold-soft); color: var(--gold-ink); }
    .rowLabel.outside { background: var(--burgundy-wash); }
    .cell { min-height: 0; height: var(--cell-h); width: var(--cell-w); padding: 0; border: 0; border-right: 1px solid transparent; border-bottom: 1px solid var(--hairline); border-radius: 0; background: transparent; }
    .cell.beat { border-left: 1px solid var(--hairline); }
    .cell.bar { border-left: 1px solid var(--ink-muted); }
    @media (hover: hover) { .cell:hover:not(:disabled) { background: var(--blue-soft); border-color: var(--hairline); } .cell.bar:hover:not(:disabled) { border-left-color: var(--ink-muted); } }
    .cell:focus-visible { outline-offset: -2px; }
    .bars { position: absolute; top: 0; left: var(--label-w); right: 0; bottom: 0; pointer-events: none; z-index: 2; }
    .noteBar { position: absolute; height: calc(var(--cell-h) - 9px); margin-top: 4px; border-radius: var(--radius-sm); }
    .noteBar.active { background: var(--blue); border: 1px solid var(--blue); }
    .noteBar.other { background: transparent; border: 1px dashed var(--burgundy-mid); }
    .playhead { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--gold); opacity: 0; will-change: transform; }
    .playhead.on { opacity: 1; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12px; color: var(--ink-muted); }
    .legend i { display: inline-block; width: 22px; height: 10px; margin-right: 6px; vertical-align: middle; border-radius: var(--radius-sm); }
    .legend .a { background: var(--blue); } .legend .o { border: 1px dashed var(--burgundy-mid); }

    /* feedback sits below what it describes and keeps its height */
    .status { min-height: 24px; font-size: 13.5px; line-height: 24px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status.alert { color: var(--alert); }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; }

    dialog { width: min(520px, calc(100vw - 32px)); padding: 16px; color: var(--ink); background: var(--surface-raised); border: 1px solid var(--hairline); border-radius: var(--radius-sm); }
    dialog::backdrop { background: #0008; }
    dialog h2 { margin: 0 0 12px; font: 600 24px/28px var(--font-display); color: var(--burgundy-ink); }
    .projectList { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; margin: 0 0 12px; padding: 0; list-style: none; }
    .projectList li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px; background: var(--surface-sunk); border: 1px solid var(--hairline); }
    .projectList .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .projectList small { display: block; font-weight: 400; color: var(--ink-muted); }
    .dialogActions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }

    @media (max-width: 520px) { .work { padding: 16px; gap: 12px; } .rollInner { --label-w: 72px; } .saveState { width: 7.5em; } }
  </style>
</head>
<body>
  <header class="appBar">
    <div class="appBarTop">
      <a class="home" href="https://nickvuci.com" target="_blank" rel="noopener" aria-label="Nick Vuci — nickvuci.com">
        <svg width="36" height="14" aria-hidden="true" viewBox="-9.89 0 209.79 80" shape-rendering="geometricPrecision">
          <defs>
            <clipPath id="nvClip"><rect x="-29.89" y="0" width="249.79" height="80" /></clipPath>
            <linearGradient id="nvBlend" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="118" y2="0">
              <stop offset="0" style="stop-color: var(--brand-blue)" /><stop offset="1" style="stop-color: var(--gold)" />
            </linearGradient>
          </defs>
          <polyline clip-path="url(#nvClip)" points="-17.74,102.14 0,72.14 38,7.86 76,72.14 114,7.86 152,72.14 190,7.86 207.74,-22.14" fill="none" stroke="url(#nvBlend)" stroke-width="16" stroke-linejoin="miter" stroke-miterlimit="10" />
        </svg>
        <span class="wordmark"><span class="n">Nick</span> <span class="v">Vuci</span></span>
      </a>
      <span class="appName">Workstation</span>
      <button type="button" class="themeToggle" aria-pressed="false" aria-label="Switch to dark theme" title="Switch to dark theme">
        <svg class="ti ti-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M19.5 14.2A7.5 7.5 0 0 1 9.8 4.5a7.5 7.5 0 1 0 9.7 9.7Z" /></svg>
        <svg class="ti ti-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.6" /><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" /></svg>
      </button>
    </div>
    <div class="standing">
      <label class="srOnly" for="projectName">Project name</label>
      <input class="projectName" id="projectName" type="text" maxlength="80" spellcheck="false" />
      <span class="saveState" id="saveState" aria-live="polite"></span>
    </div>
  </header>

  <main class="work">
    <section class="task" id="task" hidden aria-live="polite">
      <div class="eyebrow">Exercise</div>
      <h2 id="taskTitle"></h2>
      <p id="taskBody"></p>
      <div class="taskState" id="taskState"></div>
    </section>

    <section class="card" aria-label="Scale">
      <div class="cardHeader"><span>Scale</span><span class="mono" id="scaleMeta"></span></div>
      <div class="scaleChips" id="scaleChips"></div>
      <div class="row">
        <form class="addInterval" id="addIntervalForm">
          <span class="field"><label for="intervalInput">Add an interval</label><input id="intervalInput" type="text" placeholder="7/4" autocomplete="off" spellcheck="false" /></span>
          <button type="submit">Add</button>
        </form>
        <span class="field"><label for="referenceHz">1/1 in Hz</label><input id="referenceHz" type="number" min="20" max="2000" step="1" /></span>
      </div>
      <div class="status" id="scaleStatus" aria-live="polite"></div>
    </section>

    <section class="card" aria-label="Composition">
      <div class="cardHeader"><span>Composition</span><span class="mono" id="gridMeta"></span></div>
      <div class="row" style="margin-bottom: 12px">
        <span class="field"><label id="laneLabel">Write on</label>
          <span class="segmented" role="group" aria-labelledby="laneLabel" id="laneButtons">
            <button type="button" data-lane="chords">Chords</button><button type="button" data-lane="melody">Melody</button>
          </span></span>
        <span class="field"><label id="lengthLabel">Note length</label>
          <span class="segmented" role="group" aria-labelledby="lengthLabel" id="lengthButtons">
            <button type="button" data-ticks="480">1/8</button><button type="button" data-ticks="960">1/4</button><button type="button" data-ticks="1920">1/2</button><button type="button" data-ticks="3840">Bar</button>
          </span></span>
        <span class="field"><label for="tempo">Tempo (BPM)</label><input id="tempo" type="number" min="30" max="240" step="1" /></span>
        <span class="field"><label for="bars">Bars</label><select id="bars"><option>1</option><option>2</option><option>4</option><option>8</option></select></span>
        <span class="field"><label for="range">Range</label><select id="range"><option value="1">One equave</option><option value="2">Two equaves</option></select></span>
        <label class="check"><input id="droneOn" type="checkbox" /> Drone on</label>
        <span class="field"><label for="dronePitch">Drone pitch</label><select id="dronePitch"></select></span>
      </div>
      <div class="roll" id="roll"><div class="rollInner" id="rollInner"></div></div>
      <div class="legend"><span><i class="a"></i><span id="legendActive">Melody</span> (the lane you are writing)</span><span><i class="o"></i><span id="legendOther">Chords</span></span></div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="tools">
        <button type="button" id="undo">Undo</button>
        <button type="button" id="redo">Redo</button>
        <button type="button" id="clearLane">Clear this lane</button>
        <button type="button" id="exportFile">Export file</button>
        <button type="button" id="importFile">Import file</button>
        <button type="button" id="renderWav">Save as WAV</button>
        <input id="fileInput" type="file" accept=".json,application/json" hidden />
      </div>
    </section>
  </main>

  <nav class="controlBar" aria-label="Workstation controls">
    <button type="button" id="projects">Projects</button>
    <button type="button" class="main" id="play">Play</button>
    <button type="button" id="save">Save</button>
  </nav>

  <dialog id="projectsDialog" aria-labelledby="projectsTitle">
    <h2 id="projectsTitle">Projects</h2>
    <ul class="projectList" id="projectList"></ul>
    <div class="dialogActions">
      <button type="button" id="newProject">New project</button>
      <button type="button" id="closeProjects">Close</button>
    </div>
  </dialog>

  <script src="../audio/synth.js"></script>
  <script type="module" src="workstation.js"></script>
</body>
</html>
