<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Example Animation</title>
  <style>
    :root {
      --bg: #080912;
      --text: #f7f8ff;
      --gold: #ffd166;
      --blue: #8fd3ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .scene {
      width: 100%;
      height: 100%;
      min-height: 260px;
      display: grid;
      place-items: center;
      position: relative;
      background:
        radial-gradient(circle at 50% 45%, rgba(143,211,255,0.16), transparent 42%),
        radial-gradient(circle at 50% 50%, rgba(255,209,102,0.10), transparent 58%);
    }

    .word {
      color: var(--gold);
      font-size: clamp(3rem, 14vw, 10rem);
      line-height: 0.88;
      font-weight: 950;
      letter-spacing: -0.08em;
      opacity: 0;
      transform: scale(0.96);
      text-shadow: 0 0 42px rgba(255,209,102,0.28);
      transition: opacity 120ms linear, transform 120ms linear;
    }

    .ring {
      position: absolute;
      width: min(48vmin, 390px);
      aspect-ratio: 1;
      border: 2px solid rgba(143,211,255,0.28);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.72);
      transition: opacity 120ms linear, transform 120ms linear;
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Example animation">
    <div class="ring" id="ring"></div>
    <div class="word" id="word">animation</div>
  </main>

  <script>
    const word = document.getElementById("word");
    const ring = document.getElementById("ring");

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function animationOpacity(progress) {
      if (progress <= 0.34) return progress / 0.34;
      if (progress <= 0.66) return 1;
      return Math.max(0, (1 - progress) / 0.34);
    }

    function setProgress(value) {
      const progress = clamp(Number(value) || 0, 0, 1);
      const opacity = animationOpacity(progress);
      word.style.opacity = String(opacity);
      word.style.transform = `scale(${0.96 + 0.08 * opacity})`;
      ring.style.opacity = String(opacity * 0.9);
      ring.style.transform = `scale(${0.72 + 0.58 * progress})`;
    }

    window.addEventListener("message", event => {
      if (event.source !== window.parent) return;
      const message = event.data || {};

      if (message.type === "lesson-animation-progress") {
        setProgress(message.progress);
      }

      if (message.type === "lesson-animation-reset") {
        setProgress(0);
      }
    });

    setProgress(0);
  </script>
</body>
</html>
