<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just Intonation Animation</title>
  <style>
    :root {
      --bg: #080912;
      --text: #f7f8ff;
      --muted: #b9bfd1;
      --blue: #8fd3ff;
      --gold: #ffd166;
      --line: rgba(255,255,255,0.14);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .scene {
      width: 100%;
      height: 100%;
      position: relative;
      background: var(--bg);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #080912;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <main class="scene" id="ratio-animation" aria-label="Just intonation introduction: two waves in a 2/1 ratio">
    <canvas id="ratioCanvas"></canvas>
  </main>

  <script src="../audio/synth.js"></script>
  <script>
    /*
      Four-panel JI intro (port of the Manim scene JIIntro).

      Panels, top to bottom:
        1) upper sine, 2x the cycles of the lower one, always moving
        2) the fraction 2/1
        3) lower sine (base cycles), always moving
        4) one caption at a time, fixed size, word-wrapped

      The lesson drives `progress` (0..1) over DURATION seconds; the waves'
      travel uses the real clock so they keep moving while paused or finished.
    */

    const canvas = document.getElementById("ratioCanvas");
    const ctx = canvas.getContext("2d");
    const section = document.getElementById("ratio-animation");

    // ----- timings (seconds, same as the Manim scene) -----
    const PRE_ROLL = 1.0;
    const FADE_DUR = 1.5;
    const HOLD_DUR = 2.5;
    const CAPTION_OUT = 0.9;
    const FINAL_HOLD_DUR = 2.5;
    const OUTRO_FADE_DUR = 2.5;
    const TAIL = 0.2;

    const T1 = PRE_ROLL;                       // lower wave + caption 1 in
    const T1_OUT = T1 + FADE_DUR + HOLD_DUR;   // caption 1 out
    const T2 = T1_OUT + CAPTION_OUT;           // upper wave + caption 2 in
    const T2_OUT = T2 + FADE_DUR + HOLD_DUR;   // caption 2 out
    const T3 = T2_OUT + CAPTION_OUT;           // fraction + caption 3 + boxes in
    const T4 = T3 + FADE_DUR + FINAL_HOLD_DUR; // everything out
    const DURATION = T4 + OUTRO_FADE_DUR + TAIL; // 17.5 s

    // ----- waves -----
    const BASE_CYCLES = 4;                 // across the full width, lower wave
    const UPPER_CYCLES = BASE_CYCLES * 2;  // 2/1
    const VERTICAL_MARGIN = 0.18;
    const MANIM_FRAME_WIDTH = 14.222;      // to keep Manim's 1 unit/s travel speed
    const ROOT_HZ = 110;
    const UPPER_HZ = ROOT_HZ * UPPER_CYCLES / BASE_CYCLES;

    // ----- captions -----
    const CAPTIONS = [
      "If the pitch or frequency of a musical note is the number of times per second it causes the air to vibrate,",
      "and an interval is when two notes play at the same time,",
      "then Just Intonation (or JI) is where the frequencies of the notes form whole-number ratios with each other."
    ];

    let w = 1;
    let h = 1;
    let clock = 0;          // seconds of wave travel (real time)
    let last = performance.now();
    let progress = 0;
    let playing = false;
    let muted = false;
    let audioStarted = false;
    let captionLayouts = [];

    function clamp(v, min = 0, max = 1) {
      return Math.max(min, Math.min(max, v));
    }

    // Linear ramp from 0 to 1 between a and b (Manim used rate_func=linear).
    function ramp(time, a, b) {
      return clamp((time - a) / (b - a));
    }

    function opacities(time) {
      const outro = 1 - ramp(time, T4, T4 + OUTRO_FADE_DUR);
      return {
        lower: ramp(time, T1, T1 + FADE_DUR) * outro,
        upper: ramp(time, T2, T2 + FADE_DUR) * outro,
        frac: ramp(time, T3, T3 + FADE_DUR) * outro,
        boxes: ramp(time, T3, T3 + FADE_DUR) * outro,
        captions: [
          ramp(time, T1, T1 + FADE_DUR) * (1 - ramp(time, T1_OUT, T1_OUT + CAPTION_OUT)),
          ramp(time, T2, T2 + FADE_DUR) * (1 - ramp(time, T2_OUT, T2_OUT + CAPTION_OUT)),
          ramp(time, T3, T3 + FADE_DUR) * outro
        ]
      };
    }

    function isVisible() {
      const rect = section.getBoundingClientRect();
      return rect.bottom > 0 && rect.top < window.innerHeight;
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, window.innerWidth < 700 ? 1.35 : 1.9);
      w = Math.max(1, rect.width);
      h = Math.max(1, rect.height);
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layoutCaptions();
    }

    // ----- caption wrapping: fixed font size, greedy word wrap -----
    function captionFont(size) {
      return `italic 400 ${size}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
    }

    function wrap(text, maxWidth) {
      const words = text.split(/\s+/);
      const lines = [];
      let current = "";
      for (const word of words) {
        const trial = current ? current + " " + word : word;
        if (ctx.measureText(trial).width <= maxWidth || !current) {
          current = trial;
        } else {
          lines.push(current);
          current = word;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    // One size for every caption. Start from the Manim proportion and only
    // step down if the longest caption would overflow its panel (small screens).
    function layoutCaptions() {
      const panelH = h / 4;
      const margin = w * (0.6 / MANIM_FRAME_WIDTH);
      const maxWidth = Math.max(40, w - 2 * margin);
      let size = Math.max(12, Math.min(30, h * 0.043));

      for (; size >= 10; size -= 1) {
        ctx.font = captionFont(size);
        const layouts = CAPTIONS.map(text => wrap(text, maxWidth));
        const tallest = Math.max(...layouts.map(lines => lines.length)) * size * 1.25;
        if (tallest <= panelH * 0.92 || size === 10) {
          captionLayouts = layouts.map(lines => ({ lines, size }));
          return;
        }
      }
    }

    // ----- drawing -----
    function speedPx() {
      return w / MANIM_FRAME_WIDTH; // 1 Manim unit per second
    }

    function drawWave(cycles, yCenter, color, alpha) {
      if (alpha <= 0.001) return;
      const panelH = h / 4;
      const amp = (panelH / 2) * (1 - VERTICAL_MARGIN);
      const k = (2 * Math.PI * cycles) / w;
      const shift = speedPx() * clock;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2, Math.min(4, h * 0.006));
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      const step = 2;
      for (let x = 0; x <= w + step; x += step) {
        // crest at the left edge at time 0, travelling right
        const y = yCenter - amp * Math.sin(k * (x - shift) + Math.PI / 2);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    // One box per lower-wave cycle, sliding with the waves, in both wave panels.
    function drawCycleBoxes(alpha) {
      if (alpha <= 0.001) return;
      const panelH = h / 4;
      const cycleW = w / BASE_CYCLES;
      const offset = (speedPx() * clock) % cycleW;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = "rgba(225,228,240,0.62)";
      ctx.lineWidth = 2;
      for (const top of [0, panelH * 2]) {
        for (let i = -1; i <= BASE_CYCLES; i++) {
          const x = offset + i * cycleW;
          ctx.strokeRect(x, top + 1, cycleW, panelH - 2);
        }
      }
      ctx.restore();
    }

    function drawFraction(numerator, denominator, cx, cy, panelH, color, alpha) {
      if (alpha <= 0.001) return;
      const total = panelH * 0.7;
      const size = total * 0.46;
      const gap = total * 0.04;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      ctx.font = `600 ${size}px "Times New Roman", Georgia, serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(numerator), cx, cy - size / 2 - gap);
      ctx.fillText(String(denominator), cx, cy + size / 2 + gap);
      ctx.lineWidth = Math.max(2, size * 0.07);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(cx - size * 0.42, cy);
      ctx.lineTo(cx + size * 0.42, cy);
      ctx.stroke();
      ctx.restore();
    }

    function drawCaption(index, cy, alpha) {
      const layout = captionLayouts[index];
      if (!layout || alpha <= 0.001) return;
      const lineH = layout.size * 1.25;
      const startY = cy - ((layout.lines.length - 1) * lineH) / 2;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#f7f8ff";
      ctx.font = captionFont(layout.size);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      layout.lines.forEach((line, i) => ctx.fillText(line, w / 2, startY + i * lineH));
      ctx.restore();
    }

    function draw() {
      const time = progress * DURATION;
      const op = opacities(time);
      const panelH = h / 4;
      const yCenters = [0, 1, 2, 3].map(i => panelH / 2 + i * panelH);

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#080912";
      ctx.fillRect(0, 0, w, h);

      drawWave(BASE_CYCLES, yCenters[2], "#8fd3ff", op.lower);
      drawWave(UPPER_CYCLES, yCenters[0], "#ffd166", op.upper);
      drawCycleBoxes(op.boxes);
      drawFraction(UPPER_CYCLES / BASE_CYCLES, 1, w / 2, yCenters[1], panelH, "#ffd166", op.frac);
      op.captions.forEach((alpha, i) => drawCaption(i, yCenters[3], alpha));

      updateAudio(op.lower, op.upper);
    }

    // ----- audio: the two waves sound as 110 Hz and 220 Hz (2/1) -----
    function updateAudio(lowerAlpha, upperAlpha) {
      if (!isVisible() || !playing || muted) {
        silenceAudio(0.02);
        return;
      }
      if (!audioStarted || !window.XenAudio) return;
      XenAudio.updateDrone({ id: "ji-animation-root", frequency: ROOT_HZ, gain: lowerAlpha * 0.15, rampTime: 0.035 });
      XenAudio.updateDrone({ id: "ji-animation-upper", frequency: UPPER_HZ, gain: upperAlpha * 0.12, rampTime: 0.035 });
    }

    function silenceAudio(timeConstant = 0.025) {
      if (!audioStarted || !window.XenAudio) return;
      XenAudio.updateDrone({ id: "ji-animation-root", frequency: ROOT_HZ, gain: 0, rampTime: timeConstant });
      XenAudio.updateDrone({ id: "ji-animation-upper", frequency: UPPER_HZ, gain: 0, rampTime: timeConstant });
    }

    async function startAudio() {
      if (!window.XenAudio || !XenAudio.isAvailable()) return;
      await XenAudio.resume();
      await XenAudio.startDrone({ id: "ji-animation-root", frequency: ROOT_HZ, gain: 0, voice: "soft" });
      await XenAudio.startDrone({ id: "ji-animation-upper", frequency: UPPER_HZ, gain: 0, voice: "soft" });
      audioStarted = true;
    }

    function setProgress(value) {
      progress = clamp(Number(value) || 0);
      draw();
    }

    function frame(now) {
      const dt = Math.min(48, now - last) / 1000;
      last = now;
      clock += dt;
      draw();
      requestAnimationFrame(frame);
    }

    window.addEventListener("message", event => {
      if (event.origin !== window.location.origin) return;
      const message = event.data || {};

      if (message.type === "lesson-animation-progress") setProgress(message.progress);
      if (message.type === "lesson-animation-play") {
        playing = true;
        if (!(Number(message.progress) > 0)) clock = 0; // crests start at the left edge
        startAudio().catch(() => {
          playing = false;
          silenceAudio(0.015);
        });
        setProgress(message.progress);
      }
      if (message.type === "lesson-animation-pause") {
        playing = false;
        silenceAudio(0.015);
      }
      if (message.type === "lesson-animation-reset") {
        playing = false;
        clock = 0;
        setProgress(0);
        silenceAudio(0.015);
      }
      if (message.type === "lesson-animation-finish") {
        playing = false;
        setProgress(1);
        silenceAudio(0.035);
      }
      if (message.type === "lesson-animation-mute") {
        muted = Boolean(message.muted);
        if (muted) silenceAudio(0.015);
      }
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        resize();
        draw();
      }, 120);
    });

    resize();
    draw();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
