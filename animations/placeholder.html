<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video placeholder</title>
  <style>
    html { color-scheme: dark !important; }
    :root { --text: #f7f8ff; --gold: #ffd166; --quiet: rgba(247,248,255,0.62); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .placeholder { width: 100%; height: 100%; min-height: 260px; display: grid; place-content: center; gap: 0.6rem; text-align: center;
      padding: 1.5rem; border: 2px dashed rgba(247,248,255,0.22); border-radius: 12px; }
    .kind { color: var(--quiet); font-size: 0.85rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .concept { color: var(--gold); font-size: clamp(1.6rem, 6vw, 3rem); font-weight: 800; }
    .note { color: var(--quiet); font-size: 0.95rem; }
  </style>
</head>
<body>
  <!-- Placeholder: the video for this concept goes here. Lessons point at this file with ?concept=Name. -->
  <main class="placeholder" aria-label="Video placeholder">
    <div class="kind">Video</div>
    <div class="concept" id="concept">Coming soon</div>
    <div class="note">This video is still to be made.</div>
  </main>
  <script>
    const name = new URLSearchParams(window.location.search).get("concept");
    if (name) document.getElementById("concept").textContent = name;
    // Lesson animation messages (play, pause, progress, reset) need no response here.
    window.addEventListener("message", () => {});
  </script>
</body>
</html>
